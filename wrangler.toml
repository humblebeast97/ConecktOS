#:schema node_modules/wrangler/config-schema.json
# Points Wrangler at the TanStack Start build output. `npm run build` emits
# `dist/server/server.js` (a Web Standards fetch handler) plus `dist/client/`
# for browser assets. Cloudflare serves matching static files from the ASSETS
# binding first, then falls through to the Worker for SSR routes.

name = "conecktos"
main = "dist/server/server.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "dist/client"
